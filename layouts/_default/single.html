{{ define "main" }}
  <article class="post">
    <header class="page-heading">
      <a class="back-link" href="{{ "posts/" | relURL }}">← All posts</a>
      <h1>{{ .Title }}</h1>
      <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "January 2, 2006" }}</time>
    </header>
    <div class="prose">{{ .Content }}</div>
  </article>
{{ end }}
